# Job one-shot che riconcilia il realm "onepiece" con lo stato dichiarato in
# realm-onepiece.json (più, fuori da "remote", realm-onepiece-dev-users.json), sostituendo l'idea che "--import-realm" da solo tenga
# un realm già esistente allineato (vedi docs/adr/0011). Applicato/ricreato
# ad ogni sync da scripts/sync-realm-config.sh (hook postsync della release
# "keycloak"), non gestito da Helm: un Job è immutabile, quindi va eliminato
# e riapplicato esplicitamente per farlo rieseguire quando il contenuto della
# ConfigMap montata cambia (o per correggere drift introdotto a mano via
# Admin Console, non solo per inseguire i commit).
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config-cli
  namespace: auth
  labels:
    project: onepiece-api
    component: identity-provider
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        project: onepiece-api
        component: identity-provider
    spec:
      restartPolicy: Never
      containers:
        - name: keycloak-config-cli
          # v6.5.1 (ultima stabile), tag per major Keycloak (nessun tag per
          # la patch esatta 26.6.4 pubblicato da upstream - schema di
          # tagging per major version, la compatibilità entro lo stesso
          # major è l'assunzione esplicita di upstream). Host del registry
          # esplicito (docker.io): sui nodi OKE il runtime CRI ha lo short
          # name mode in "enforcing" e rifiuta un nome immagine senza
          # registry come ambiguo (osservato nel primo deploy remoto).
          image: docker.io/adorsys/keycloak-config-cli:6.5.1-26
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak-http.auth.svc.cluster.local:8080
            - name: KEYCLOAK_USER
              value: admin
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: one-piece-keycloak-admin-credentials
                  key: password
            # Variabili del realm ($(env:...) in realm-onepiece.json): i
            # segreti dei client non stanno nel file.
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: one-piece-realm-secrets
                  key: PROXY_CLIENT_SECRET
            - name: USER_SERVICE_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: one-piece-realm-secrets
                  key: USER_SERVICE_ADMIN_CLIENT_SECRET
            - name: IMPORT_FILES_LOCATIONS
              value: /config/*.json
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 120s
          volumeMounts:
            - name: realm-config
              mountPath: /config
              readOnly: true
          # Contenuto da riverificare dopo la prima esecuzione reale (nodo
          # Ampere A1 condiviso, budget stretto - stesso spirito di
          # docs/adr/0005 sul tuning delle risorse).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # Prefissi numerici: i file vanno importati in ordine (i ruoli del
        # realm prima degli utenti che li referenziano), e il glob non
        # garantisce altro che l'ordine alfabetico. La ConfigMap degli utenti
        # di prova manca in "remote" (optional).
        - name: realm-config
          projected:
            sources:
              - configMap:
                  name: one-piece-realm-config
                  items:
                    - key: realm-onepiece.json
                      path: 10-realm-onepiece.json
              - configMap:
                  name: one-piece-realm-dev-users
                  optional: true
                  items:
                    - key: realm-onepiece-dev-users.json
                      path: 20-realm-onepiece-dev-users.json
              # Irrigidimento di produzione (D4): solo in "remote".
              - configMap:
                  name: one-piece-realm-hardening
                  optional: true
                  items:
                    - key: realm-onepiece-hardening.json
                      path: 30-realm-onepiece-hardening.json
