# Valori Helm per oauth2-proxy/oauth2-proxy — ambiente locale (kind).
#
# Le credenziali (client-id, client-secret, cookie-secret) NON sono definite
# qui: sono lette da un Secret Kubernetes esterno referenziato tramite
# `config.existingSecret`. Il manifest reale (con valori generati/placeholder)
# vive in `oauth2-proxy/secret.local.yaml`, escluso da git dal pattern
# `*secret*.yaml` in .gitignore. La versione tracciata è
# `oauth2-proxy/secret.local.example.yaml`.

config:
  existingSecret: one-piece-oauth2-proxy-credentials
  emailDomains:
    - "*"
  # Frontend come catch-all ("/"), backend sotto "/api/" — con --upstream
  # il path della URI stessa è la route (instradata così com'è, non
  # riscritta): il backend espone quindi i suoi endpoint sotto lo stesso
  # prefisso (server.servlet.context-path=/api, vedi application.properties
  # nel repo one-piece-user-service). Namespace "app".
  upstreams:
    - "http://one-piece-user-frontend.app.svc.cluster.local/"
    - "http://one-piece-user-service.app.svc.cluster.local/api/"

service:
  type: ClusterIP
  portNumber: 4180

httpScheme: http

# Flag passati direttamente al binario oauth2-proxy.
# ref: https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview
extraArgs:
  provider: oidc
  # Un solo provider configurato: reindirizza subito a Keycloak invece di
  # mostrare una pagina intermedia "Sign in with...".
  skip-provider-button: "true"
  # skip-oidc-discovery: gli URL di discovery (auth/token/jwks) sono
  # forniti esplicitamente sotto, perché browser e pod raggiungono
  # Keycloak con hostname diversi (localhost:8080 vs DNS interno).
  skip-oidc-discovery: "true"
  # Issuer stabile: deve combaciare esattamente con l'issuer emesso da
  # Keycloak (KC_HOSTNAME=localhost, KC_HOSTNAME_PORT=8080).
  oidc-issuer-url: "http://localhost:8080/realms/onepiece"
  # login-url: il browser ci viene reindirizzato direttamente, quindi deve
  # essere raggiungibile dal browser (localhost, non il DNS interno).
  login-url: "http://localhost:8080/realms/onepiece/protocol/openid-connect/auth"
  # redeem-url e jwks-url: chiamate server-to-server da oauth2-proxy verso
  # Keycloak, quindi usano il Service DNS interno al cluster.
  redeem-url: "http://keycloak-http.auth.svc.cluster.local:8080/realms/onepiece/protocol/openid-connect/token"
  oidc-jwks-url: "http://keycloak-http.auth.svc.cluster.local:8080/realms/onepiece/protocol/openid-connect/certs"
  redirect-url: "http://localhost:4180/oauth2/callback"
  # Necessario perché "/oauth2/sign_out?rd=..." (Step 1: logout completo, vedi
  # UF-IDU-08) reindirizza a Keycloak — un host diverso da quello del proxy —
  # per terminare anche la sessione SSO lato identity provider. Senza questo
  # whitelist, oauth2-proxy scarta un "rd" assoluto verso un altro host per
  # prevenire un open redirect.
  whitelist-domain: "localhost:8080"
  code-challenge-method: "S256"
  cookie-secure: "false"
  cookie-samesite: "lax"
  # pass-authorization-header è l'unica cosa che serve al backend: inoltra
  # "Authorization: Bearer <jwt>" all'upstream (solo lato richiesta, mai
  # riflesso nella risposta) perché user-service lo valida come resource
  # server OAuth2 (vedi SecurityConfig nel repo one-piece-user-service).
  pass-authorization-header: "true"
  # set-xauthrequest/pass-access-token sono deliberatamente OFF (il default):
  # con set-xauthrequest attivo, oauth2-proxy ripete X-Auth-Request-User/
  # -Email/-Access-Token anche come header della RISPOSTA al browser — cioè
  # JWT in chiaro ed email dell'utente visibili in ogni richiesta dai
  # DevTools, da un'estensione del browser o da un eventuale XSS, senza che
  # nessun upstream li usi. pass-basic-auth (default true) è disattivato per
  # lo stesso motivo lato upstream: né il frontend né il backend leggono
  # X-Forwarded-User/-Email, quindi non c'è motivo di inoltrarli.
  pass-basic-auth: "false"
  http-address: "0.0.0.0:4180"
  # L'health check del backend resta l'unico percorso pubblico (i probe
  # Kubernetes non possono autenticarsi). Tutto il resto, incluso /api/me
  # (Step 1), resta dietro login.
  skip-auth-route: "GET=^/api/actuator/health"
