# Template per oauth2-proxy/secret.local.yaml (quest'ultimo è escluso da git).
# Per generarlo:
#   1. Copia questo file in secret.local.yaml
#   2. Sostituisci client-secret con il valore configurato nel client
#      "onepiece-proxy" del realm (keycloak/realm-onepiece.json)
#   3. Genera un cookie secret casuale a 32 byte, in base64 URL-safe
#      (oauth2-proxy decodifica solo questa variante):
#        openssl rand -base64 32 | tr -- '+/' '-_'
#   4. kubectl apply -f oauth2-proxy/secret.local.yaml
apiVersion: v1
kind: Secret
metadata:
  name: one-piece-oauth2-proxy-credentials
  namespace: auth
  labels:
    project: onepiece-api
    component: identity-provider
type: Opaque
stringData:
  client-id: onepiece-proxy
  client-secret: REPLACE_WITH_CLIENT_SECRET
  cookie-secret: REPLACE_WITH_RANDOM_32_BYTE_BASE64
