name: Deploy remote

# Aggiorna l'ambiente "remote" (k3s su una VM Always Free, ADR-0027) con
# "helmfile --environment remote sync". Innescato da push diretti a questo
# repo e dai repository applicativi dopo che pubblicano nuove immagini
# multi-arch su GHCR (repository_dispatch).
#
# L'API di k3s (6443) non è esposta a internet: il job entra dal tunnel
# WireGuard come peer della CI, che il firewall della VM limita alla 6443, e
# si autentica come ServiceAccount ci-deployer (kubernetes/ci-deployer.yaml).
#
# Deliberatamente NON esegue "terraform apply": le modifiche Terraform restano
# manuali e locali, dopo aver letto un plan (terraform/README.md).

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-remote]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-remote
  # A differenza di test-infrastructure.yml (kind cluster usa-e-getta), qui
  # i run si accodano invece di cancellarsi: interrompere un "helmfile sync"
  # a metà contro il cluster reale lascerebbe uno stato incoerente.
  cancel-in-progress: false

env:
  # Stessa minor di k3s (var.k3s_version in terraform/variables.tf, D9).
  KUBECTL_VERSION: v1.36.3
  HELM_VERSION: v4.2.4
  HELMFILE_VERSION: v1.7.4
  HELMFILE_ENVIRONMENT: remote
  # Indirizzi nel tunnel (locals in terraform/compute.tf, D8): la VM è .1,
  # la CI .2. L'API di k3s risponde sull'indirizzo della VM (tls-san).
  WG_SERVER_IP: 10.99.0.1
  WG_CI_IP: 10.99.0.2
  # Vault OCI letto da External Secrets Operator (terraform output vault_id).
  OCI_VAULT_ID: ${{ vars.OCI_VAULT_ID }}
  OCI_REGION: ${{ vars.OCI_CLI_REGION }}
  # Bucket dei backup (terraform output object_storage_namespace).
  OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}

jobs:
  deploy-remote:
    # Spento durante la migrazione da OKE a k3s (piano k3s-remote, K1-K6):
    # si riattiva in K7 con la variabile di repo REMOTE_DEPLOY_ENABLED=true.
    if: ${{ vars.REMOTE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Installa kubectl/helm/helmfile (versioni pinnate) e WireGuard
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Fuori dal workspace: il kubeconfig non finisce mai tra i file del repo.
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

          curl -sL -o "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"

          curl -sL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"

          curl -sL "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" helmfile

          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools

      # Chiave privata solo nel file (0600), mai in argomenti o log. Il peer
      # instrada solo l'indirizzo della VM nel tunnel; il keepalive tiene
      # aperto il NAT del runner durante i sync lunghi.
      - name: Apri il tunnel WireGuard verso la VM
        env:
          WG_CI_PRIVATE_KEY: ${{ secrets.WG_CI_PRIVATE_KEY }}
          WG_SERVER_PUBLIC_KEY: ${{ vars.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ vars.WG_ENDPOINT }}
        run: |
          sudo install -d -m 0700 /etc/wireguard
          sudo install -m 0600 /dev/null /etc/wireguard/wg0.conf
          sudo tee /etc/wireguard/wg0.conf >/dev/null <<EOF
          [Interface]
          PrivateKey = ${WG_CI_PRIVATE_KEY}
          Address = ${WG_CI_IP}/32

          [Peer]
          PublicKey = ${WG_SERVER_PUBLIC_KEY}
          Endpoint = ${WG_ENDPOINT}
          AllowedIPs = ${WG_SERVER_IP}/32
          PersistentKeepalive = 25
          EOF
          sudo wg-quick up wg0

      # Kubeconfig assemblato da valori separati (decisione 2 di K2): solo il
      # token è segreto, la CA del cluster è pubblica e verifica il server.
      - name: Genera il kubeconfig (ServiceAccount ci-deployer)
        env:
          K3S_CA_CERT: ${{ vars.K3S_CA_CERT }}
          K3S_CI_TOKEN: ${{ secrets.K3S_CI_TOKEN }}
        run: |
          printf '%s\n' "$K3S_CA_CERT" > "$RUNNER_TEMP/k3s-ca.crt"
          kubectl config set-cluster onepiece-remote \
            --server="https://${WG_SERVER_IP}:6443" \
            --certificate-authority="$RUNNER_TEMP/k3s-ca.crt" --embed-certs
          kubectl config set-credentials ci-deployer --token="$K3S_CI_TOKEN"
          kubectl config set-context onepiece-remote \
            --cluster=onepiece-remote --user=ci-deployer
          kubectl config use-context onepiece-remote
          chmod 0600 "$KUBECONFIG"
          kubectl get --raw /readyz

      - name: helmfile sync (ambiente remote)
        run: helmfile --environment remote sync

      # user-frontend/user-service/content-service/public-api/keycloak-theme usano il tag
      # mobile ":latest": un nuovo push su GHCR non cambia la stringa immagine
      # nello spec del workload, quindi "helm upgrade" non vede alcuna
      # differenza e non fa ripartire i pod, anche con
      # imagePullPolicy: Always (Kubernetes ripulisce l'immagine solo
      # quando il container si riavvia per un altro motivo, non
      # proattivamente). Restart esplicito ad ogni sync, innocuo se
      # l'immagine è già quella corrente. Keycloak gira come StatefulSet
      # (chart codecentric/keycloakx), non Deployment.
      - name: Riavvia i workload con tag mobile per forzare il pull
        run: |
          kubectl rollout restart deployment/one-piece-user-frontend -n app
          kubectl rollout restart deployment/one-piece-user-service -n app
          kubectl rollout restart deployment/one-piece-content-service -n app
          kubectl rollout restart deployment/one-piece-public-api -n app
          kubectl rollout restart statefulset/keycloak -n auth
          kubectl rollout status deployment/one-piece-user-frontend -n app --timeout=180s
          kubectl rollout status deployment/one-piece-user-service -n app --timeout=180s
          kubectl rollout status deployment/one-piece-content-service -n app --timeout=180s
          kubectl rollout status deployment/one-piece-public-api -n app --timeout=180s
          kubectl rollout status statefulset/keycloak -n auth --timeout=180s

      - name: Diagnostica (solo se un passo precedente è fallito)
        if: failure()
        run: |
          echo "::group::wg show"
          sudo wg show || true
          echo "::endgroup::"

          echo "::group::kubectl get pods -A"
          kubectl get pods -A -o wide || true
          echo "::endgroup::"

          echo "::group::kubectl describe pods -n auth"
          kubectl describe pods -n auth || true
          echo "::endgroup::"

          echo "::group::kubectl describe pods -n app"
          kubectl describe pods -n app || true
          echo "::endgroup::"

          echo "::group::kubectl get events -A"
          kubectl get events -A --sort-by=.lastTimestamp || true
          echo "::endgroup::"

          echo "::group::helm list -A"
          helm list -A || true
          echo "::endgroup::"

      # Il runner è usa-e-getta, ma tunnel e credenziali non sopravvivono al
      # job nemmeno per sbaglio.
      - name: Chiudi il tunnel e cancella le credenziali
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          sudo rm -f /etc/wireguard/wg0.conf
          rm -f "$KUBECONFIG" "$RUNNER_TEMP/k3s-ca.crt"
