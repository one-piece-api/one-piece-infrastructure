name: Test infrastructure

# Verifica che le istruzioni committate in questo repo mettano davvero in
# piedi lo stack (cluster kind + Postgres + Keycloak + whoami + oauth2-proxy)
# nello stato atteso: non un job che reimplementa il deploy in YAML, ma uno
# che invoca esattamente ./scripts/setup.sh, lo stesso comando che useresti
# in locale. Se questo job passa, "seguire il README funziona" è un fatto
# verificato ad ogni push, non solo un'affermazione.
#
# Il runner ubuntu-latest ha già Docker e jq/curl/openssl: installiamo solo
# kind/kubectl/helm/helmfile, a versioni pinnate (stesse verificate
# manualmente il 2026-08-20, vedi docs/adr/0002-helmfile-orchestration.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-infrastructure-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.32.0
  KUBECTL_VERSION: v1.36.3
  HELM_VERSION: v4.2.4
  HELMFILE_VERSION: v1.7.4
  # Usa le immagini pubblicate su GHCR (vedi environments: in
  # helmfile.yaml.gotmpl e docs/adr/0004-ci-images-from-ghcr.md) invece di
  # immagini "kind load docker-image" locali, che qui non esistono mai.
  HELMFILE_ENVIRONMENT: ci
  GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
  GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
  # Non richiesta qui: l'ambiente "ci" usa Mailpit (mock SMTP), non Resend -
  # vedi docs/adr/0008-mock-smtp-in-ci.md.

jobs:
  test-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Installa kind/kubectl/helm/helmfile (versioni pinnate)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -sL -o "$HOME/.local/bin/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"

          curl -sL -o "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"

          curl -sL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"

          curl -sL "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" helmfile

      - name: Setup completo da zero (cluster + stack via Helmfile + smoke test)
        run: ./scripts/setup.sh

      - name: Verifica idempotenza (helmfile sync una seconda volta)
        run: helmfile --environment "$HELMFILE_ENVIRONMENT" sync
        # Un secondo "helm upgrade --install" sulle stesse release, a parità
        # di values, non deve fallire: cattura regressioni in cui un
        # aggiornamento (non un install pulito) si comporta diversamente,
        # lo scenario reale una volta che il repo avrà più storia.

      # Dopo il secondo sync: i ruoli devono restare corretti anche quando il
      # Job di bootstrap gira su un'istanza già inizializzata.
      - name: Verifica i ruoli del database (ADR-0016, ADR-0018)
        run: ./scripts/03-database-roles-test.sh

      # Dopo il secondo sync: keycloak-config-cli non deve aver cancellato le
      # azioni richieste usate dall'invito (UF-IDU-01) e dalla cancellazione
      # self-service (ADR-0013).
      - name: Verifica le azioni richieste del realm (ADR-0011, ADR-0013)
        run: ./scripts/04-realm-required-actions-test.sh

      - name: Verifica l'irrigidimento del realm (D3/D4)
        run: ./scripts/05-realm-hardening-test.sh

      - name: Verifica il client dell'AI editor (ADR-0026)
        run: ./scripts/06-ai-editor-client-test.sh

      - name: Verifica backup e ripristino (ADR-0027, PR6 D5)
        run: ./scripts/07-backup-restore-test.sh

      - name: Verifica la NetworkPolicy sui metadata del cloud (ADR-0027, D5)
        run: ./scripts/08-cloud-metadata-policy-test.sh

      - name: Diagnostica (solo se un passo precedente è fallito)
        if: failure()
        run: |
          echo "::group::kubectl get pods -A"
          kubectl get pods -A -o wide || true
          echo "::endgroup::"

          echo "::group::kubectl describe pods -n auth"
          kubectl describe pods -n auth || true
          echo "::endgroup::"

          echo "::group::kubectl describe pods -n app"
          kubectl describe pods -n app || true
          echo "::endgroup::"

          echo "::group::kubectl get events -n auth"
          kubectl get events -n auth --sort-by=.lastTimestamp || true
          echo "::endgroup::"

          echo "::group::kubectl get events -n app"
          kubectl get events -n app --sort-by=.lastTimestamp || true
          echo "::endgroup::"

          echo "::group::helm list -A"
          helm list -A || true
          echo "::endgroup::"

          echo "::group::docker ps -a"
          docker ps -a || true
          echo "::endgroup::"

  # Controlli statici dell'ambiente "remote" (k3s, ADR-0027, D7): la CI non
  # ha un cluster remoto, ma può verificare che manifest, Terraform e
  # cloud-init siano validi prima di un deploy o di una ricreazione della VM.
  # In parallelo al job kind.
  remote-static-checks:
    # Stessa release Ubuntu della VM: cloud-init schema è quello che leggerà
    # il file al primo boot.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TERRAFORM_VERSION: 1.15.8
    steps:
      - uses: actions/checkout@v7

      - name: Installa helm/helmfile/terraform (versioni pinnate) e cloud-init
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -sL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"

          curl -sL "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" helmfile

          curl -sL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          unzip -q -o /tmp/terraform.zip -d "$HOME/.local/bin" terraform

          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init

      # Valori finti: i template richiedono queste variabili (requiredEnv), il
      # contenuto non conta per il render.
      - name: helmfile template (ambiente remote)
        env:
          OCI_VAULT_ID: ocid1.vault.oc1..ci-dummy
          OCI_REGION: eu-turin-1
          OCI_OBJECT_STORAGE_NAMESPACE: ci-dummy
        run: helmfile --environment remote template > /dev/null

      - name: terraform fmt e validate (senza backend)
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      # Render con valori finti (terraform/tests/cloud-init), poi il
      # validatore ufficiale di cloud-init (decisione 3 di K2).
      - name: cloud-init schema
        run: |
          terraform -chdir=terraform/tests/cloud-init init -input=false
          terraform -chdir=terraform/tests/cloud-init apply -auto-approve -input=false
          terraform -chdir=terraform/tests/cloud-init output -raw user_data \
            > "$RUNNER_TEMP/user-data.yaml"
          cloud-init schema --config-file "$RUNNER_TEMP/user-data.yaml" --annotate
