# Cluster kind locale per lo stack di autenticazione One Piece API.
# Nessuna extraPortMapping: l'accesso ai servizi avviene esclusivamente
# tramite `kubectl port-forward`, mai tramite esposizione diretta del nodo.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: onepiece
nodes:
  - role: control-plane
