apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: {{ .Values.component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        project: onepiece-api
        component: {{ .Values.component }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: public-api
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            - name: management
              containerPort: {{ .Values.managementPort }}
          env:
            # Selects application-dev.properties (see one-piece-public-api):
            # cluster-internal DNS for the shared PostgreSQL instance, secret
            # injected below instead of hardcoded.
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: PUBLIC_API_POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.datasource.secretName }}
                  key: {{ .Values.datasource.secretKey }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
# Solo la porta dell'API: l'actuator resta raggiungibile dal kubelet (probe)
# ma non tramite il Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: {{ .Values.component }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: 80
      targetPort: http
