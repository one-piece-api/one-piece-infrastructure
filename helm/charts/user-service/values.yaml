namespace: app
component: user-service
name: one-piece-user-service
image: one-piece-user-service:local
imagePullPolicy: IfNotPresent
imagePullSecrets: []
port: 8080

# Only the secret: server-url/realm/client-id are hardcoded in
# application-dev.properties (one-piece-user-service) - identical for every
# deployment of this chart, no need to plumb them through as values too.
keycloakAdmin:
  secretName: one-piece-user-service-admin-credentials
  secretKey: client-secret

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
