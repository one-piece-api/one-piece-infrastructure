namespace: app
component: user-service
name: one-piece-user-service
image: one-piece-user-service:local
imagePullPolicy: IfNotPresent
imagePullSecrets: []
port: 8080

# Only the secret: server-url/realm/client-id are hardcoded in
# application-dev.properties (one-piece-user-service) - identical for every
# deployment of this chart, no need to plumb them through as values too.
keycloakAdmin:
  secretName: one-piece-user-service-admin-credentials
  secretKey: client-secret

# The audit_log datasource (Step 4, §13) - secret created by the
# helm/charts/postgresql release "app-postgresql" itself, same pattern as
# keycloakAdmin above. Host/database/username are hardcoded in
# application-dev.properties, identical for every deployment.
appPostgresql:
  secretName: one-piece-app-postgresql-credentials
  secretKey: password

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Overrides application.properties' keycloak.invitation.token-lifespan (PT12H) via the
# KEYCLOAK_INVITATION_TOKEN_LIFESPAN env var - Spring's relaxed binding on
# KeycloakInvitationProperties picks it up with no code change. Empty (default): keep the
# application's own PT12H. Set by the "ci" Helmfile environment only (see helmfile.yaml.gotmpl)
# to a short-lived value so one-piece-e2e can reach INVITATION_EXPIRED without waiting 12h.
invitationTokenLifespan: ""

# Overrides application.properties' spring.security.oauth2.resourceserver.jwt.issuer-uri
# (fisso su http://localhost:8080/realms/onepiece) via l'env var Spring
# standard - il claim "iss" nei token riflette l'hostname configurato su
# Keycloak stesso (vedi ADR-0001/0005), quindi in "remote" deve essere l'IP
# pubblico riservato, non "localhost". Vuoto (default): resta il valore
# nella properties, invariato per locale/CI.
jwtIssuerUri: ""
