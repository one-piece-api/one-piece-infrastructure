apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: {{ .Values.component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        project: onepiece-api
        component: {{ .Values.component }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: user-service
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            # Selects application-dev.properties (see one-piece-user-service):
            # cluster-internal DNS for Keycloak and app-postgresql, both
            # secrets injected below instead of hardcoded. Keycloak remains
            # the sole identity store (§2 of application-user-identity-management.md);
            # app-postgresql only backs the audit_log table (Step 4, §13).
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            {{- if .Values.invitationTokenLifespan }}
            # Short-lived override for the "ci" environment only (see values.yaml) - lets
            # one-piece-e2e reach INVITATION_EXPIRED without waiting the default PT12H.
            - name: KEYCLOAK_INVITATION_TOKEN_LIFESPAN
              value: {{ .Values.invitationTokenLifespan | quote }}
            {{- end }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloakAdmin.secretName }}
                  key: {{ .Values.keycloakAdmin.secretKey }}
            # The audit_log datasource (Step 4) - see docs/adr/0001-audit-log-persistence.md
            # in one-piece-user-service.
            - name: APP_POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appPostgresql.secretName }}
                  key: {{ .Values.appPostgresql.secretKey }}
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: {{ .Values.component }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: 80
      targetPort: http
