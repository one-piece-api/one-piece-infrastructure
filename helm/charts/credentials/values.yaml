# Registro dei Secret: un elemento per Secret Kubernetes, creato nel namespace
# del consumatore (un secretKeyRef non attraversa i namespace).
#   keys.<chiave>.placeholder - valore locale/CI (mai una credenziale reale, ADR-0001)
#   keys.<chiave>.vaultKey    - nome del secret in OCI Vault (solo "remote")
#   keys.<chiave>.value       - valore non segreto, uguale in ogni ambiente
#   remoteOnly                - creato solo in "remote" (ExternalSecret)
#   dockerRegistry            - ExternalSecret di tipo dockerconfigjson (chiavi username, token)
externalSecrets:
  enabled: false
  storeName: oci-vault
  refreshInterval: 1h

credentials:
  - name: one-piece-postgresql-admin-credentials
    namespace: data
    component: database
    keys:
      password: {placeholder: postgres-admin-change-me-locally, vaultKey: onepiece-postgres-admin-password}

  # Password dei ruoli, lette dai servizi consumatori (chiave "password").
  - name: one-piece-keycloak-db-credentials
    namespace: auth
    component: identity-provider
    keys:
      password: {placeholder: keycloak-db-change-me-locally, vaultKey: onepiece-keycloak-db-password}
  - name: one-piece-user-service-db-credentials
    namespace: app
    component: application
    keys:
      password: {placeholder: user-service-db-change-me-locally, vaultKey: onepiece-user-service-db-password}
  - name: one-piece-content-service-db-credentials
    namespace: app
    component: application
    keys:
      password: {placeholder: content-service-db-change-me-locally, vaultKey: onepiece-content-service-db-password}
  - name: one-piece-public-api-db-credentials
    namespace: app
    component: application
    keys:
      password: {placeholder: public-api-reader-db-change-me-locally, vaultKey: onepiece-public-api-reader-db-password}

  # Le stesse password per il Job di bootstrap di postgresql (chiave = ruolo).
  - name: one-piece-postgresql-role-credentials
    namespace: data
    component: database
    keys:
      keycloak: {placeholder: keycloak-db-change-me-locally, vaultKey: onepiece-keycloak-db-password}
      user_service: {placeholder: user-service-db-change-me-locally, vaultKey: onepiece-user-service-db-password}
      content_service: {placeholder: content-service-db-change-me-locally, vaultKey: onepiece-content-service-db-password}
      public_api_reader: {placeholder: public-api-reader-db-change-me-locally, vaultKey: onepiece-public-api-reader-db-password}

  - name: one-piece-redis-credentials
    namespace: auth
    component: identity-provider
    keys:
      password: {placeholder: redis-change-me-locally, vaultKey: onepiece-redis-password}

  - name: one-piece-keycloak-admin-credentials
    namespace: auth
    component: identity-provider
    keys:
      password: {placeholder: admin-change-me-locally, vaultKey: onepiece-keycloak-admin-password}

  - name: one-piece-oauth2-proxy-credentials
    namespace: auth
    component: identity-provider
    keys:
      client-id: {value: onepiece-proxy}
      client-secret: {placeholder: onepiece-proxy-change-me-locally, vaultKey: onepiece-proxy-client-secret}
      cookie-secret: {placeholder: localcookiesecretchangeme0000000, vaultKey: onepiece-oauth2-proxy-cookie-secret}

  - name: one-piece-user-service-admin-credentials
    namespace: app
    component: application
    keys:
      client-secret: {placeholder: user-service-admin-change-me-locally, vaultKey: onepiece-user-service-admin-client-secret}

  # Variabili del realm sostituite da keycloak-config-cli (keycloak/config-cli-job.yaml).
  - name: one-piece-realm-secrets
    namespace: auth
    component: identity-provider
    keys:
      PROXY_CLIENT_SECRET: {placeholder: onepiece-proxy-change-me-locally, vaultKey: onepiece-proxy-client-secret}
      USER_SERVICE_ADMIN_CLIENT_SECRET: {placeholder: user-service-admin-change-me-locally, vaultKey: onepiece-user-service-admin-client-secret}
      AI_EDITOR_CLIENT_SECRET: {placeholder: ai-editor-change-me-locally, vaultKey: onepiece-ai-editor-client-secret}

  # Solo "remote" (remoteOnly): altrove li creano gli script di setup da
  # .env.local o dai secret della CI.
  # imagePullSecret per ghcr.io (i package GHCR sono privati), un Secret per namespace.
  - name: ghcr-pull-secret
    namespace: app
    component: application
    remoteOnly: true
    dockerRegistry: ghcr.io
    keys:
      username: {vaultKey: onepiece-ghcr-pull-username}
      token: {vaultKey: onepiece-ghcr-pull-token}
  - name: ghcr-pull-secret
    namespace: auth
    component: identity-provider
    remoteOnly: true
    dockerRegistry: ghcr.io
    keys:
      username: {vaultKey: onepiece-ghcr-pull-username}
      token: {vaultKey: onepiece-ghcr-pull-token}

  # Token DNS-01 di cert-manager (ADR-0021).
  - name: cloudflare-dns-api-token
    namespace: cert-manager
    component: certificates
    remoteOnly: true
    keys:
      api-token: {vaultKey: onepiece-cloudflare-dns-token}

  # Credenziale SMTP di Keycloak (ADR-0007), letta da scripts/configure-realm-smtp.sh.
  - name: one-piece-resend-credentials
    namespace: auth
    component: identity-provider
    remoteOnly: true
    keys:
      api-key: {vaultKey: onepiece-resend-api-key}
