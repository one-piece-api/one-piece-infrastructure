{{- range .Values.credentials }}
{{- if or $.Values.externalSecrets.enabled (not .remoteOnly) }}
---
{{- if $.Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    project: onepiece-api
    component: {{ .component }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecrets.storeName }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- $literals := dict }}
    {{- range $key, $spec := .keys }}
    {{- if hasKey $spec "value" }}{{ $_ := set $literals $key $spec.value }}{{ end }}
    {{- end }}
    {{- if .dockerRegistry }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .dockerRegistry }}":{"username":"{{ "{{ .username }}" }}","password":"{{ "{{ .token }}" }}","auth":"{{ "{{ printf \"%s:%s\" .username .token | b64enc }}" }}"}}}'
    {{- else if $literals }}
    template:
      mergePolicy: Merge
      data:
        {{- range $key, $value := $literals }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- range $key, $spec := .keys }}
    {{- if hasKey $spec "vaultKey" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $spec.vaultKey }}
    {{- end }}
    {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    project: onepiece-api
    component: {{ .component }}
type: Opaque
stringData:
  {{- range $key, $spec := .keys }}
  {{ $key }}: {{ (coalesce $spec.value $spec.placeholder) | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
