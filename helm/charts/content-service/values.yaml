namespace: app
component: content-service
name: one-piece-content-service
image: one-piece-content-service:local
imagePullPolicy: IfNotPresent
imagePullSecrets: []
port: 8080

# This service's own database content_service in the shared PostgreSQL
# instance (ADR-0016), secret created in this namespace by the
# helm/charts/postgresql release itself, same pattern as user-service's
# datasource value.
datasource:
  secretName: one-piece-content-service-db-credentials
  secretKey: password

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Overrides application.properties' spring.security.oauth2.resourceserver.jwt.issuer-uri
# via the Spring-standard env var - same override user-service's chart makes for the
# "remote" environment (the token's "iss" claim reflects Keycloak's configured public
# hostname, not "localhost"). Empty (default): keep the application's own value,
# unchanged for local/CI.
jwtIssuerUri: ""
