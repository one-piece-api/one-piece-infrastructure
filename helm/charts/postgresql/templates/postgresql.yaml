apiVersion: v1
kind: Secret
metadata:
  name: one-piece-postgresql-credentials
  namespace: auth
  labels:
    project: onepiece-api
    component: identity-provider
type: Opaque
stringData:
  # Placeholder locale: NON usare in un ambiente reale.
  password: "keycloak-db-change-me-locally"
---
apiVersion: v1
kind: Service
metadata:
  name: one-piece-postgresql
  namespace: auth
  labels:
    project: onepiece-api
    component: identity-provider
spec:
  clusterIP: None
  selector:
    app: one-piece-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: one-piece-postgresql
  namespace: auth
  labels:
    project: onepiece-api
    component: identity-provider
spec:
  serviceName: one-piece-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: one-piece-postgresql
  template:
    metadata:
      labels:
        app: one-piece-postgresql
        project: onepiece-api
        component: identity-provider
    spec:
      containers:
        - name: postgresql
          image: postgres:18.6
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: one-piece-postgresql-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
