# Istanza PostgreSQL unica e condivisa (ADR-0016): un database e un ruolo
# proprietario per ciascun servizio, dichiarati in "databases" (helmfile),
# non un'istanza per servizio.
namespace: data
component: database
name: one-piece-postgresql
# Registry esplicito: CRI-O (runtime dei nodi OKE) rifiuta un nome immagine
# non qualificato ("short name mode is enforcing") - containerd (kind) non
# ha questa restrizione, da cui il funzionamento in locale/CI nonostante il
# nome breve fosse sufficiente lì.
image: docker.io/library/postgres:18.6

# Superuser "postgres" (password nel chart "credentials"): usato solo
# dall'istanza stessa e dal Job di bootstrap, mai da un servizio applicativo.
admin:
  secretName: one-piece-postgresql-admin-credentials

# Un elemento per servizio:
#   database/username - database e ruolo proprietario creati dal Job di bootstrap
#   secretNamespace   - namespace del servizio consumatore
#   secretName        - Secret (chiave "password") letto dal servizio consumatore
databases: []

# Ruoli che leggono il database di un altro servizio (ADR-0018), creati
# dopo i database:
#   username                          - ruolo
#   database                          - unico database su cui ha CONNECT
#   connectionLimit/statementTimeout  - tetto alle connessioni e alla durata di una query
#   secretNamespace/secretName        - come in "databases"
readers: []

storage: 2Gi
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Backup logico giornaliero (ADR-0027, PR6 D5): attivo solo in "remote"
# (helmfile). Dump dei "databases" sopra + ruoli, caricato con rclone su OCI
# Object Storage via instance principal. 03:00, prima della finestra di
# riavvio automatico delle 04:00 (D9).
backup:
  enabled: false
  schedule: "0 3 * * *"
  timeZone: Europe/Rome
  uploaderImage: docker.io/rclone/rclone:1.75.2
  # terraform output -raw backup_bucket / object_storage_namespace / region.
  objectStorage:
    bucket: ""
    namespace: ""
    region: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
