{{- if .Values.denyPaths }}
# Percorsi negati con una risposta diretta 404 (D3): il filtro è una risorsa
# di Envoy Gateway, la Gateway API standard non ha risposte dirette.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ .Values.name }}-deny
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: {{ .Values.component }}
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: Not Found
{{- end }}
