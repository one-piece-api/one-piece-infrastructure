apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: {{ .Values.component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        project: onepiece-api
        component: {{ .Values.component }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: user-frontend
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          {{- if .Values.keycloakOrigin }}
          env:
            # Origin di Keycloak così come raggiungibile dal browser -
            # genera config.json a startup del container (vedi
            # docker-entrypoint.d/40-generate-runtime-config.sh nel repo
            # one-piece-user-frontend, docs/adr/0001-runtime-config-injection.md).
            # Override per l'ambiente "remote" (vedi helmfile.yaml.gotmpl);
            # vuoto altrove, resta il default del Dockerfile (localhost:8080).
            - name: KEYCLOAK_ORIGIN
              value: {{ .Values.keycloakOrigin | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: {{ .Values.component }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: 80
      targetPort: http
