name: onepiece
# Namespace di Envoy Gateway: il controller crea il Deployment/Service del
# proxy Envoy nel proprio namespace, quindi Gateway ed EnvoyProxy stanno qui.
namespace: envoy-gateway-system
controllerName: gateway.envoyproxy.io/gatewayclass-controller

# Namespace le cui HTTPRoute possono agganciarsi al Gateway (minimo
# privilegio: non "All"). Ogni rotta sta nel namespace del Service a cui
# punta, così non servono ReferenceGrant.
routeNamespaces:
  - auth
  - app

# Service LoadBalancer del proxy: in "remote" lo espone ServiceLB di k3s
# sulle porte della VM (ADR-0027); in locale/CI resta <pending>, come già con
# ingress-nginx.
service:
  annotations: {}
  # Il default di Envoy Gateway è "Local"; "Cluster" è il comportamento di
  # ingress-nginx che sostituiamo (step I1: comportamento invariato). L'IP
  # reale del client arriva comunque da Cloudflare (clientIPHeader).
  externalTrafficPolicy: Cluster

# Listener HTTPS (ADR-0021), solo in "remote": il Secret TLS è il
# certificato wildcard emesso da cert-manager (chart "certificates") nel
# namespace del Gateway. Finché non è emesso, il listener resta non pronto
# e la porta 80 continua a servire.
https:
  enabled: false
  certificateSecretName: ""

# Header da cui il proxy prende l'IP reale del client (ADR-0020): in
# "remote" "CF-Connecting-IP", affidabile perché l'origin accetta solo
# Cloudflare. Vuoto = indirizzo della connessione (locale/CI).
clientIPHeader: ""

proxy:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
