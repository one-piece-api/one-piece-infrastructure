apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.name }}
  labels:
    project: onepiece-api
    component: ingress
spec:
  controllerName: {{ .Values.controllerName }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.name }}
    namespace: {{ .Values.namespace }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: ingress
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
        {{- with .Values.service.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      envoyDeployment:
        container:
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    project: onepiece-api
    component: ingress
spec:
  gatewayClassName: {{ .Values.name }}
  # Nessun "hostname" sui listener: accettano qualunque host, come la regola
  # catch-all dell'Ingress sostituito (host per sottodominio: step I3).
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        {{- include "gateway.allowedRoutes" . | nindent 8 }}
    {{- if .Values.https.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "https.certificateSecretName obbligatorio con https.enabled" .Values.https.certificateSecretName }}
      allowedRoutes:
        {{- include "gateway.allowedRoutes" . | nindent 8 }}
    {{- end }}
