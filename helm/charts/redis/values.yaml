# Unica istanza per ora: session storage di oauth2-proxy nel namespace
# "auth" (vedi docs/adr/0009-redis-session-store.md). Nessuna password
# reale: come per helm/charts/postgresql, è un backing store raggiungibile
# solo dentro il cluster, il placeholder locale è sufficiente (ADR-0001).
namespace: auth
component: identity-provider
name: one-piece-redis
image: redis:8.10.1-alpine
secretName: one-piece-redis-credentials
# Local-dev placeholder only — never a real credential. See ADR-0001.
password: "redis-change-me-locally"
