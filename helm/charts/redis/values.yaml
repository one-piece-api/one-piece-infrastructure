# Unica istanza per ora: session storage di oauth2-proxy nel namespace
# "auth" (vedi docs/adr/0009-redis-session-store.md). La password sta nel
# chart "credentials" (PR1).
namespace: auth
component: identity-provider
name: one-piece-redis
# Registry esplicito: CRI-O (runtime dei nodi OKE) rifiuta un nome immagine
# non qualificato ("short name mode is enforcing") - vedi
# helm/charts/postgresql/values.yaml per lo stesso motivo.
image: docker.io/library/redis:8.10.1-alpine
secretName: one-piece-redis-credentials
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
